<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة المسار المهني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
/* =========================================================
   الإعدادات العامة
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #173f5f;
    --primary-dark: #0f2f49;
    --primary-light: #eaf3f8;
    --accent: #2c7a9f;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #dce3e8;
    --white: #ffffff;
    --danger-bg: #fff1f2;
    --danger-text: #b42318;
    --success-bg: #ecfdf3;
    --success-text: #087443;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Tahoma, "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 15%, rgba(44,122,159,.12), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(23,63,95,.14), transparent 32%),
        linear-gradient(135deg, #eef5f8 0%, #e6edf2 50%, #dce7ed 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    position: relative;
    overflow: hidden;
}

/* خلفيات زخرفية */

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    width: 320px;
    height: 320px;
    top: -150px;
    right: -120px;
    background: rgba(44,122,159,.10);
}

body::after {
    width: 280px;
    height: 280px;
    bottom: -140px;
    left: -110px;
    background: rgba(23,63,95,.10);
}


/* =========================================================
   الحاوية الرئيسية
   ========================================================= */

.login-container {
    width: 100%;
    max-width: 455px;
    position: relative;
    z-index: 1;
}


/* =========================================================
   البطاقة
   ========================================================= */

.login-card {
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 26px;
    padding: 38px 38px 30px;
    box-shadow:
        0 25px 70px rgba(15,47,73,.16),
        0 5px 18px rgba(15,47,73,.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: cardAppear .55s ease-out;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   الشعار
   ========================================================= */

.logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.logo {
    width: 82px;
    height: 82px;
    border-radius: 23px;

    background:
        linear-gradient(145deg, #1d557b, #123852);

    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: 800;

    box-shadow:
        0 12px 25px rgba(23,63,95,.24),
        inset 0 1px 0 rgba(255,255,255,.22);

    position: relative;
}

.logo::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.14);
}


/* =========================================================
   العنوان والوصف
   ========================================================= */

h1 {
    text-align: center;
    color: var(--primary);
    font-size: 27px;
    font-weight: 800;
    margin-bottom: 9px;
    letter-spacing: -.3px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.9;
    margin-bottom: 30px;
}


/* =========================================================
   النموذج
   ========================================================= */

#loginForm {
    width: 100%;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #344054;
    font-size: 14px;
    font-weight: 700;
}

.input-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    color: #8293a1;
    font-size: 17px;
    pointer-events: none;
}

input {
    width: 100%;
    height: 52px;
    padding: 13px 45px 13px 14px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: #f9fbfc;
    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    outline: none;
    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        transform .2s ease;
}

input::placeholder {
    color: #9aa6b2;
}

input:hover {
    border-color: #bdcbd5;
}

input:focus {
    background: #ffffff;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(44,122,159,.11);
}


/* =========================================================
   زر تسجيل الدخول
   ========================================================= */

button {
    width: 100%;
    height: 53px;

    margin-top: 5px;

    border: none;
    border-radius: 13px;

    background:
        linear-gradient(135deg, #194a6e, #123852);

    color: #ffffff;

    font-family: inherit;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 9px 20px rgba(18,56,82,.18);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

button:hover {
    background:
        linear-gradient(135deg, #153f60, #0d2d45);

    transform: translateY(-1px);

    box-shadow:
        0 12px 25px rgba(18,56,82,.24);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: .65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}


/* =========================================================
   الرسائل
   ========================================================= */

.message {
    margin-top: 18px;
    padding: 13px 15px;

    border-radius: 12px;

    display: none;

    line-height: 1.7;
    text-align: center;
    font-size: 14px;
    font-weight: 600;

    animation: messageAppear .25s ease-out;
}

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: translateY(-4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.error {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid #fecdd3;
}

.success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid #bbf7d0;
}


/* =========================================================
   تذييل البطاقة
   ========================================================= */

.footer {
    margin-top: 25px;
    padding-top: 18px;

    border-top: 1px solid #edf0f2;

    text-align: center;
    color: #98a2b3;
    font-size: 12.5px;
}

.footer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.footer-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #36a269;
    box-shadow: 0 0 0 3px rgba(54,162,105,.10);
}


/* =========================================================
   الهاتف
   ========================================================= */

@media (max-width: 520px) {

    body {
        padding: 18px 14px;
    }

    .login-card {
        padding: 30px 22px 24px;
        border-radius: 22px;
    }

    .logo {
        width: 74px;
        height: 74px;
        border-radius: 20px;
        font-size: 30px;
    }

    h1 {
        font-size: 23px;
    }

    .subtitle {
        font-size: 13.5px;
        margin-bottom: 25px;
    }

    input {
        height: 50px;
    }

    button {
        height: 51px;
    }
}


/* =========================================================
   تقليل الحركة عند طلب المستخدم
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-wrapper">
            <div class="logo">م</div>
        </div>

        <h1>منصة المسار المهني</h1>

        <p class="subtitle">
            نظام متابعة المسار المهني والترقيات
            <br>
            المؤسسة العمومية الإستشفائية بأولف
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="أدخل البريد الإلكتروني"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button type="submit" id="loginButton">
                تسجيل الدخول
            </button>

        </form>


        <div id="message" class="message"></div>


        <div class="footer">

            <span class="footer-badge">
                <span class="footer-dot"></span>
                منصة إدارية داخلية
            </span>

        </div>

    </div>

</div>


<script>
"use strict";

const loginForm=document.getElementById("loginForm");
const loginButton=document.getElementById("loginButton");
const message=document.getElementById("message");

function getSupabaseClient(){
    if(typeof db!=="undefined"&&db&&db.auth&&typeof db.auth.signInWithPassword==="function") return db;
    throw new Error("تعذر الاتصال بإعدادات Supabase. يرجى التأكد من ملف config.js.");
}

function showMessage(text,type){
    message.textContent=text;
    message.className="message "+type;
    message.style.display="block";
}

function getLoginErrorMessage(error){
    if(!error) return "حدث خطأ أثناء تسجيل الدخول.";

    const msg=String(error.message||"").toLowerCase();

    if(msg.includes("invalid login credentials")||msg.includes("invalid credentials"))
        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

    if(msg.includes("email not confirmed"))
        return "يجب تأكيد البريد الإلكتروني قبل تسجيل الدخول.";

    if(msg.includes("too many requests"))
        return "تم تجاوز عدد محاولات الدخول. يرجى الانتظار قليلًا ثم المحاولة مرة أخرى.";

    return error.message||"حدث خطأ أثناء تسجيل الدخول.";
}

loginForm.addEventListener("submit",async function(event){

    event.preventDefault();

    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;

    if(!email||!password){
        showMessage("يرجى إدخال البريد الإلكتروني وكلمة المرور.","error");
        return;
    }

    loginButton.disabled=true;
    loginButton.textContent="جارٍ تسجيل الدخول...";
    message.style.display="none";

    try{

        const supabaseClient=getSupabaseClient();

        const {data,error}=await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if(error) throw error;

        if(!data||!data.user)
            throw new Error("تعذر الحصول على بيانات المستخدم.");

        const {data:adminData,error:adminError}=await supabaseClient
            .from("user_roles")
            .select("role")
            .eq("user_id",data.user.id)
            .eq("role","admin")
            .maybeSingle();

        if(adminError) throw adminError;

        if(!adminData){

            await supabaseClient.auth.signOut();

            throw new Error(
                "هذا الحساب غير مصرح له بالدخول إلى لوحة المسؤول."
            );
        }

        showMessage(
            "تم تسجيل الدخول بنجاح. جاري فتح لوحة المسؤول...",
            "success"
        );

        setTimeout(function(){
            window.location.href="admin.html";
        },800);

    }catch(error){

        console.error("Login error:",error);

        showMessage(
            getLoginErrorMessage(error),
            "error"
        );

    }finally{

        loginButton.disabled=false;
        loginButton.textContent="تسجيل الدخول";

    }

});
</script>

</body>
</html>
